<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderPall — Podróżuj razem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body class="page-landing">
  <div class="app app--landing">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <a href="index.html" class="topbar__brand" aria-label="WanderPall">
          <img src="logo/WanderPall-logo_color_full.svg" alt="" class="topbar__brand-img topbar__brand-img--full" aria-hidden="true">
          <img src="logo/WanderPall-logo_color.svg" alt="WanderPall" class="topbar__brand-img topbar__brand-img--mark">
        </a>
      </div>
      <div class="topbar__actions">
        <button type="button" class="topbar__theme" aria-label="Przełącz motyw">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button type="button" class="topbar__link topbar__link--with-icon" data-auth-login data-icon="log-in"><span>Zaloguj</span></button>
        <button type="button" class="topbar__link topbar__link--with-icon" data-auth-logout hidden data-icon="log-out"><span>Wyloguj</span></button>
        <a href="account.html" class="topbar__link topbar__link--with-icon topbar__link--hide-mobile" data-auth-account data-icon="user"><span>Konto</span></a>
      </div>
    </header>

    <div class="app-body app-body--landing">
      <main class="main main--landing">
        <section class="hero" aria-label="Strona główna">
          <div class="hero__video-wrap" aria-hidden="true"></div>
          <div class="hero__overlay" aria-hidden="true"></div>

          <div class="hero__content">
            <div class="hero__split">
              <div class="hero__brand">
                <img src="logo/WanderPall-logo_color.svg" alt="" class="hero__brand-logo" width="120" height="88">
                <p class="hero__brand-name">
                  <span class="hero__brand-wander">Wander</span><span class="hero__brand-pall">Pall</span>
                </p>
              </div>

              <div class="hero__message">
                <h1 class="hero__headline">
                  <span class="hero__word-slot" aria-live="polite"></span>&nbsp;<span class="hero__together">razem.</span>
                </h1>

                <div class="hero__actions">
                  <button type="button" class="btn btn--primary btn--hero btn--with-icon" data-icon="arrow-right" data-icon-pos="after">W drogę!</button>
                </div>
              </div>
            </div>
          </div>

          <footer class="hero__footer">
            <a href="dashboard.html" class="btn btn--secondary btn--dev">Przejrzyj projekt</a>
            <p class="hero__dev">tryb deweloperski</p>
          </footer>
        </section>
      </main>
    </div>
  </div>

  <script src="js/clips.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/hero.js"></script>
</body>
</html>
